<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314213d'/%3E%3Cpath d='M32 17v8M32 35v8' stroke='%238a94a6' stroke-width='3' stroke-linecap='round'/%3E%3Crect x='14' y='6' width='36' height='13' rx='4' fill='%2322c55e'/%3E%3Cpath d='M25 12.5l4 4 9-8' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='14' y='25.5' width='36' height='13' rx='4' fill='%23facc15'/%3E%3Ccircle cx='32' cy='32' r='3.5' fill='%2322c55e' stroke='%2314213d' stroke-width='1.5'/%3E%3Crect x='14' y='45' width='36' height='13' rx='4' fill='%233b4a66'/%3E%3Crect x='28' y='50' width='8' height='6' rx='1.2' fill='%23c7cfdc'/%3E%3Cpath d='M29.5 50v-2a2.5 2.5 0 0 1 5 0v2' fill='none' stroke='%23c7cfdc' stroke-width='1.6'/%3E%3C/svg%3E">
<title>TGP Runs</title><style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f0f2f5;
    --line: #dfe3ea;
    --text: #1c2230;
    --muted: #6b7385;
    --green: #16a34a;
    --green-bg: #ecfdf3;
    --green-line: #a7e3bd;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --red-line: #f5b5b5;
    --amber: #b45309;
    --amber-bg: #fffbeb;
    --blue: #2563eb;
    --yellow: #a16207;
    --yellow-bg: #fefce8;
    --yellow-line: #fde047;
    --yellow-bar: #eab308;
    --orange: #c2410c;
    --orange-bg: #fff7ed;
    --orange-line: #fdba74;
    --orange-bar: #f97316;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-columns: 320px 1fr; grid-template-rows: 56px 1fr;
    grid-template-areas: "top top" "side main";
  }
  /* top bar */
  .top { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 0 20px;
         border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { font-weight: 700; letter-spacing: .5px; }
  .brand span { color: var(--green); }
  .top .spacer { flex: 1; }
  .url { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--line);
         border-radius: 8px; padding: 4px 10px; color: var(--muted); font-family: Consolas, monospace; font-size: 12px; }
  .url input { border: 0; background: transparent; font: inherit; color: var(--text); outline: none; width: 220px; padding: 0; }
  .url input:disabled { color: var(--text); }
  .url.bad { border-color: var(--red); }
  .err { color: var(--red); font-size: 12px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
           padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: #b9c0cd; background: var(--panel-2); }
  button.primary { background: var(--green); color: #fff; border-color: var(--green); font-weight: 600; }
  button.primary:hover { background: #15803d; }
  button.danger:hover { border-color: var(--red); color: var(--red); }
  button.small { padding: 3px 9px; font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; }
  .seg button.on { background: var(--panel-2); color: var(--green); font-weight: 600; }

  /* left pane */
  .side { grid-area: side; border-right: 1px solid var(--line); background: var(--panel); padding: 16px; overflow: auto; }
  .side h4 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .8px; }
  .field input, .field textarea { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
                                  border-radius: 8px; padding: 7px 9px; font: inherit; }
  .field textarea { min-height: 64px; resize: vertical; }
  .field input:disabled, .field textarea:disabled { background: var(--panel-2); border-color: transparent; color: var(--text); }
  .kv { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); }
  .timeline { margin-top: 22px; }
  .ev { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .ev .ts { color: var(--muted); font-family: Consolas, monospace; flex: none; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }

  /* main */
  .main { grid-area: main; overflow: auto; padding: 24px 28px; }
  .runhead .title { font-size: 24px; font-weight: 700; margin: 0; }
  .runhead input.title { background: transparent; border: 1px dashed var(--line); color: var(--text); border-radius: 6px; padding: 2px 6px; font: inherit; font-size: 24px; font-weight: 700; width: 520px; max-width: 100%; }
  .runhead .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }
  .chip.active { color: var(--yellow); border-color: var(--yellow-line); background: var(--yellow-bg); }
  .chip.completed { color: var(--green); border-color: var(--green-line); background: var(--green-bg); }
  .chip.failed { color: var(--red); border-color: var(--red-line); background: var(--red-bg); }
  .chip.draft { color: var(--amber); border-color: #f3d79a; background: var(--amber-bg); }
  .stats { display: flex; gap: 22px; margin: 16px 0 10px; color: var(--muted); font-size: 12px; }
  .stats b { color: var(--text); }
  .progress { height: 6px; background: #e6e9ef; border-radius: 999px; overflow: hidden; margin: 0 0 24px; }
  .progress > div { height: 100%; background: var(--green); transition: width .4s; }
  .banner { background: var(--amber-bg); border: 1px solid #f3d79a; color: var(--amber); border-radius: 8px; padding: 8px 12px; margin-top: 14px; font-size: 12px; }

  .board { display: flex; gap: 14px; align-items: flex-start; padding-bottom: 20px; }
  .stage { min-width: 250px; width: 250px; }
  .stagehead { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--muted);
               font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .stage.locked { opacity: .5; }
  .stage.open .stagehead { color: var(--green); font-weight: 600; }
  .lanes { display: flex; flex-direction: column; gap: 10px; }
  .connector { align-self: center; color: #b9c0cd; font-size: 22px; margin-top: 22px; }

  .task { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 12px 16px;
          cursor: pointer; position: relative; overflow: hidden; box-shadow: 0 1px 2px rgba(20,30,50,.04); }
  .task::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
  /* card colors: done green, running yellow, awaiting approval orange, failed or stopped red */
  .task.completed { border-color: var(--green-line); background: var(--green-bg); }
  .task.completed::before { background: var(--green); }
  .task.in_progress { border-color: var(--yellow-line); background: var(--yellow-bg); }
  .task.in_progress::before { background: var(--yellow-bar); }
  .task.failed { border-color: var(--red-line); background: var(--red-bg); }
  .task.failed::before { background: var(--red); }
  .task.skipped { border-style: dashed; }
  .task.skipped .tt { text-decoration: line-through; color: var(--muted); }
  .task.sel { outline: 2px solid var(--blue); outline-offset: 1px; }
  .task .row { display: flex; align-items: center; gap: 8px; }
  .task .tt { font-weight: 600; flex: 1; }
  .task .ds { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .task .ft { margin-top: 8px; display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; font-family: Consolas, monospace; }
  .completed .status { color: var(--green); }
  .in_progress .status { color: var(--yellow); }
  .failed .status { color: var(--red); }

  .diode { width: 10px; height: 10px; border-radius: 50%; background: #cfd5df; flex: none; }
  /* status dot: running green (pulsing), done green, awaiting approval orange, failed or stopped red, pending or locked grey */
  .in_progress .diode { background: var(--green); animation: pulse 1.4s infinite; }
  .completed .diode { background: var(--green); }
  .failed .diode { background: var(--red); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(22,163,74,.6); } 70% { box-shadow: 0 0 0 9px rgba(22,163,74,0); } 100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); } }

  .addtask { border: 1px dashed #c4cad6; border-radius: var(--radius); padding: 8px; text-align: center; color: var(--muted); cursor: pointer; font-size: 12px; }
  .addtask:hover { color: var(--green); border-color: var(--green); }
  .addstage { min-width: 110px; align-self: stretch; border: 1px dashed #c4cad6; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; }
  .addstage:hover { color: var(--green); border-color: var(--green); }
  .zoomtag { position: fixed; right: 16px; bottom: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
             padding: 3px 10px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .zoomtag:hover { color: var(--text); border-color: #b9c0cd; }
  .notfound { max-width: 420px; margin: 80px auto; text-align: center; }

  /* TGP live additions */
  .chip.paused { color: var(--amber); border-color: #f3d79a; background: var(--amber-bg); }
  .chip.awaiting_approval { color: var(--orange); border-color: var(--orange-line); background: var(--orange-bg); }
  .chip.blocked { color: var(--red); border-color: var(--red-line); background: var(--red-bg); }
  .chip.done { color: var(--green); border-color: var(--green-line); background: var(--green-bg); }
  .chip.aborted { color: var(--red); border-color: var(--red-line); background: var(--red-bg); }
  .banner.red { background: var(--red-bg); border-color: var(--red-line); color: var(--red); }
  .banner.gray { background: var(--panel-2); border-color: var(--line); color: var(--muted); }
  .task.awaiting_approval { border-color: var(--orange-line); background: var(--orange-bg); }
  .task.awaiting_approval::before { background: var(--orange-bar); }
  .awaiting_approval .diode { background: var(--orange-bar); animation: pulseA 1.4s infinite; }
  .awaiting_approval .status { color: var(--orange); }
  .task.stopped { border-color: var(--red-line); background: var(--red-bg); }
  .task.stopped::before, .stopped .diode { background: var(--red); }
  .stopped .diode { animation: none; }
  .stopped .status { color: var(--red); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 11px; margin: 0 0 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; border: 1px solid; }
  .legend .l-done { background: var(--green-bg); border-color: var(--green); }
  .legend .l-run { background: var(--yellow-bg); border-color: var(--yellow-bar); }
  .legend .l-wait { background: var(--orange-bg); border-color: var(--orange-bar); }
  .legend .l-fail { background: var(--red-bg); border-color: var(--red); }
  .legend .l-pend { background: var(--panel); border-color: #cfd5df; }
  @keyframes pulseA { 0% { box-shadow: 0 0 0 0 rgba(249,115,22,.55); } 70% { box-shadow: 0 0 0 9px rgba(249,115,22,0); } 100% { box-shadow: 0 0 0 0 rgba(249,115,22,0); } }
  .task.gatefail { border-color: var(--red-line); }
  .gates { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
  .g { width: 8px; height: 8px; border-radius: 2px; background: #cfd5df; }
  .g.pass { background: var(--green); } .g.fail { background: var(--red); } .g.wait { background: var(--orange-bar); }
  .gl { font-size: 12px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: var(--panel); }
  .gl .gh { display: flex; gap: 6px; align-items: baseline; }
  .gl .gk { font-weight: 600; font-size: 11px; }
  .gl.pass .gk { color: var(--green); } .gl.fail .gk { color: var(--red); } .gl.wait .gk { color: var(--orange); } .gl.none .gk { color: var(--muted); }
  .gl .gd { color: var(--muted); font-family: Consolas, monospace; font-size: 11px; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .gl pre { margin: 4px 0 0; max-height: 140px; overflow: auto; background: var(--panel-2); padding: 6px; border-radius: 6px; font-size: 11px; white-space: pre-wrap; }
  .val { font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; background: var(--panel-2); border-radius: 6px; padding: 6px 8px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: #cfd5df; }
  .live.on .dot { background: var(--green); } .live.off .dot { background: var(--red); }
  .ev .et { color: var(--muted); font-size: 11px; }
  .ev.gate_failed span:last-child, .ev.task_failed span:last-child { color: var(--red); }
  .ev.task_completed span:last-child, .ev.run_completed span:last-child { color: var(--green); }
  .ev.awaiting_approval span:last-child { color: var(--orange); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
  textarea.snippet { width: 100%; min-height: 120px; font-family: Consolas, monospace; font-size: 11px; border: 1px solid var(--line); border-radius: 8px; padding: 6px; background: var(--panel-2); resize: vertical; }
  a { color: var(--blue); text-decoration: none; }

  html, body { overflow: auto; height: auto; }
  body { display: block; }
  .top { min-height: 52px; box-sizing: border-box; }
  .wrap { width: auto; }
  td .tpl { white-space: nowrap; }
  td:first-child { min-width: 260px; }
  .wrap { max-width: 1100px; margin: 24px auto; padding: 0 20px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: middle; }
  th { background: var(--panel-2); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  tr:hover td { background: #fafbfd; }
  .bar { width: 120px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .bar div { height: 100%; background: var(--green); }
  .tpl { font-family: Consolas, monospace; font-size: 12px; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0 18px; }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
</style></head><body>
<div class="top"><div class="brand">TGP <span>Runs</span></div><div class="spacer"></div><span class="live" id="live"><span class="dot"></span><span id="livetxt">connecting</span></span></div>
<div class="wrap">
  <div class="hint">Every workflow run in this TGP home. Start one with <code>tgp start dummy-12</code>, it appears here within a second. Click a run to open its live canvas.</div>
  <div id="list"><div class="empty">Loading...</div></div>
  <h4 style="margin-top:28px">Templates</h4><div id="tpls" class="hint"></div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = iso => iso ? new Date(iso).toLocaleString([], { hour12: false }) : '';
function render(runs) {
  const el = document.getElementById('list');
  if (!runs.length) { el.innerHTML = '<div class="empty">No runs yet. Start one with tgp start dummy-12</div>'; return; }
  runs.sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''));
  el.innerHTML = `<table><tr><th>Run</th><th>Template</th><th>State</th><th>Progress</th><th>Updated</th></tr>${runs.map(r => `<tr>
    <td><a href="/r/${encodeURIComponent(r.run_id)}"><b>${esc(r.title)}</b></a><br><span class="tpl">${esc(r.run_id)}</span></td>
    <td class="tpl">${esc(r.template)}</td><td><span class="chip ${esc(r.state)}">${esc(String(r.state).replace('_', ' '))}</span></td>
    <td><span class="bar"><div style="width:${r.progress.percent}%"></div></span>${r.progress.completed}/${r.progress.total}</td>
    <td>${esc(fmt(r.updated_at))}</td></tr>`).join('')}</table>`;
}
function live(on, t) { document.getElementById('live').className = 'live ' + (on ? 'on' : 'off'); document.getElementById('livetxt').textContent = t; }
async function poll() { try { const r = await fetch('/api/v1/runs'); render(await r.json()); live(true, 'polling'); } catch { live(false, 'offline'); } }
let timer = null;
if (window.EventSource) {
  const es = new EventSource('/api/v1/runs/stream');
  es.addEventListener('runs', e => { live(true, 'live'); if (timer) { clearInterval(timer); timer = null; } render(JSON.parse(e.data)); });
  es.onerror = () => { live(false, 'reconnecting'); if (!timer) timer = setInterval(poll, 2000); };
} else { timer = setInterval(poll, 2000); poll(); }
fetch('/api/v1/templates').then(r => r.json()).then(ts => {
  document.getElementById('tpls').innerHTML = ts.map(t => `<div><code>tgp start ${esc(t.id)}</code> &nbsp;${esc(t.title)} (${t.tasks} tasks, ${t.stages} stages)</div>`).join('');
});
</script></body></html>
